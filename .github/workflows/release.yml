name: Release

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  release:
    name: Tag, Release & Publish
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the push tag triggers subsequent workflows if needed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET workloads (Android)
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build --no-restore -c Release
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}

      - name: Test (unit)
        run: >
          dotnet test tests/DotSerial.Tests.Unit
          --no-build -c Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Pack NuGet
        run: >
          dotnet pack src/DotSerial -c Release --no-build
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}
          -o ./artifacts

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.gitversion.outputs.semVer }}"
          git push origin "v${{ steps.gitversion.outputs.semVer }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: v${{ steps.gitversion.outputs.semVer }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
