name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET workloads (Android — all platforms)
        run: dotnet workload install android

      - name: Install .NET workloads (iOS — macOS only)
        if: matrix.os == 'macos-latest'
        run: dotnet workload install ios

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build --no-restore -c Release
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}

      - name: Test (unit, no integration)
        run: >
          dotnet test tests/DotSerial.Tests.Unit
          --no-build -c Release
          --logger "trx;LogFileName=unit-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/*.trx'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'
          flags: unit,${{ matrix.os }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
