name: Publish to NuGet

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/DotSerial/DotSerial.csproj

      - name: Build
        run: dotnet build src/DotSerial/DotSerial.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/DotSerial.Tests.Unit --no-build -c Release

      - name: Pack
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          dotnet pack src/DotSerial/DotSerial.csproj \
            -c Release --no-build \
            -p:Version="$VERSION" \
            -o ./artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
