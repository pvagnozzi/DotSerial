name: Publish to NuGet

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer requires full git history to resolve the version tag

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET workloads
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore src/DotSerial/DotSerial.csproj

      - name: Build
        # MinVer reads the release tag (e.g. v1.2.3) and embeds the version automatically.
        # fetch-depth: 0 above ensures the tag is available in the shallow clone.
        run: dotnet build src/DotSerial/DotSerial.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/DotSerial.Tests.Unit -c Release

      - name: Pack
        # MinVer already set the version during Build; pass --no-build so it is not rebuilt.
        run: dotnet pack src/DotSerial/DotSerial.csproj -c Release --no-build -o ./artifacts

      - name: Push packages to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbol packages to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
